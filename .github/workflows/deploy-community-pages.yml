name: Deploy community directory to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '國劇之境住戶名單.html'
      - '.github/workflows/deploy-community-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare standalone website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -- '國劇之境住戶名單.html' _site/index.html
          cp -- '國劇之境住戶名單.html' '_site/國劇之境住戶名單.html'
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
